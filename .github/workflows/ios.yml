name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  XCODE_VERSION: '26.6'

jobs:
  test:
    # Manual troubleshooting follows the same main-only CI policy as pushes.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Print versions, generate project, build and test
        run: make ci-local
